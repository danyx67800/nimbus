name: nimbus

services:
  prepara:
    image: alpine:3
    restart: "no"
    network_mode: none
    command:
      - sh
      - -c
      - "mkdir -p /data && chown -R 1000:1000 /data"
    volumes:
      - ./data:/data

  app:
    build: .
    image: nimbus:1.1.0
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    ports:
      - "${NIMBUS_PORT:-3456}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      HOST: 0.0.0.0
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      REQUIRE_HTTPS: "${REQUIRE_HTTPS:-false}"
      SECURE_COOKIES: "${SECURE_COOKIES:-auto}"
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_HOST: "${TURN_HOST:-}"
      TURN_PORT: "${TURN_PORT:-3478}"
      TURN_REALM: "${TURN_REALM:-nimbus}"
      CLAMAV_HOST: "${CLAMAV_HOST:-}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
    volumes:
      - ./data:/data
    depends_on:
      prepara:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 1g
    cpus: "2.0"

  coturn:
    image: coturn/coturn:4.6.3
    profiles: ["calls"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # coturn's binary needs this even to start; without it exec fails.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=16m
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_REALM: "${TURN_REALM:-nimbus}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:-}"
    entrypoint: ["/bin/sh", "/turn-entrypoint.sh"]
    volumes:
      - ./scripts/turn-entrypoint.sh:/turn-entrypoint.sh:ro
    mem_limit: 256m

  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - ./clamav-db:/var/lib/clamav
    environment:
      CLAMAV_NO_MILTERD: "true"
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 5m
