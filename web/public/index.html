<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0714" />
    <meta name="description" content="__APP_TAGLINE__" />
    <meta name="application-name" content="__APP_NAME__" />
    <title>__APP_NAME__</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script nonce="__CSP_NONCE__">
      try {
        var theme = localStorage.getItem('nimbus-theme');
        var atmosphere = localStorage.getItem('nimbus-atmosphere') || 'auto';
        var house = localStorage.getItem('nimbus-house');
        var resolved = atmosphere;
        if (atmosphere === 'auto') {
          resolved =
            theme === 'light'
              ? 'day'
              : theme === 'black'
                ? 'night'
                : theme === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'day'
                  : 'dusk';
        }
        document.documentElement.dataset.atmosphere = resolved;
        if (house && house !== 'none') document.documentElement.dataset.house = house;
        var color = resolved === 'day' ? '#f4ebd9' : resolved === 'night' ? '#0f1412' : '#2b2620';
        if (theme === 'light') {
          document.documentElement.dataset.theme = 'light';
        } else if (theme === 'dark' || theme === 'black') {
          document.documentElement.dataset.theme = theme;
        } else if (theme !== 'system') {
          document.documentElement.dataset.theme = 'dark';
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', color);
      } catch (error) {
        /* storage disabled */
      }
    </script>
    <link rel="stylesheet" href="/assets/styles.css" nonce="__CSP_NONCE__" />
    <link rel="stylesheet" href="/assets/artifacts.css" nonce="__CSP_NONCE__" />
    <script type="module" src="/assets/app.js" nonce="__CSP_NONCE__"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Vai al contenuto</a>
    <div id="app" class="app-root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark">__APP_NAME__</div>
        <p>Caricamento…</p>
      </div>
    </div>
    <noscript>
      <div class="noscript">Questa applicazione richiede JavaScript per funzionare.</div>
    </noscript>
    <div id="overlays"></div>
  </body>
</html>
