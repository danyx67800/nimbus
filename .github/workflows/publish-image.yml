name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nimbus:1.1.0
            ghcr.io/${{ github.repository_owner }}/nimbus:latest
          labels: |
            org.opencontainers.image.title=Nimbus
            org.opencontainers.image.description=Self-hosted files, chat, calls and quick share
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=1.1.0

      # GHCR serves this image anonymously; verified with `docker manifest
      # inspect` from an empty Docker config. Package visibility is public.
