name: Publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nimbus:1.0.0
            ghcr.io/${{ github.repository_owner }}/nimbus:latest
          labels: |
            org.opencontainers.image.title=Nimbus
            org.opencontainers.image.description=Self-hosted files, chat, calls and quick share
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=1.0.0

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH "/user/packages/container/nimbus/visibility" -f visibility=public; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not set package visibility; set it manually in GitHub package settings." >&2
          exit 1
